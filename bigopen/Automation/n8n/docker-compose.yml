services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      NODE_ENV: production
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      NODE_OPTIONS: --max-old-space-size=2560
    volumes:
      - n8n_data:/home/node/.n8n
    mem_limit: 3g
    cpus: 2

volumes:
  n8n_data:

