services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    restart: unless-stopped

    ports:
      - "8000:8000"

    volumes:
      - ./data/chroma-data:/data

    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: "/data"

  chromadb-admin:
    image: fengzhichao/chromadb-admin:latest
    container_name: chromadb-admin
    restart: unless-stopped

    ports:
      - "3001:3001"

    depends_on:
      - chromadb