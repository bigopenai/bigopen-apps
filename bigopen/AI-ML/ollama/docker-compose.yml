# Ollama: the official Ollama server plus the BigOpen chat UI.
#
#   backend   the official Ollama image; models are kept in the ollama_data volume,
#             so a restart or an update keeps them.
#   frontend  nginx serving the BigOpen UI and passing API calls to the backend.
#
# Hardware is the COMPOSE_PROFILES setting: cpu (default) or gpu for an NVIDIA GPU
# (needs the NVIDIA Container Toolkit, or Docker Desktop on Windows). Every image is
# multi-arch (x86-64 and ARM64). Docker on macOS cannot reach the Apple GPU, so a Mac
# runs cpu. A small model (LLM_DEFAULT_MODEL) is pulled on first start; pull more from the UI.
#
# Every variable with a default below shows up as a setting in the install form,
# so keep placeholder text out of comments.

x-backend: &backend
  image: ${OLLAMA_IMAGE:-ollama/ollama}:${OLLAMA_TAG:-latest}
  restart: unless-stopped
  environment:
    OLLAMA_HOST: 0.0.0.0:11434
    OLLAMA_CONTEXT_LENGTH: ${LLM_CTX_SIZE:-8192}
    OLLAMA_NUM_PARALLEL: ${LLM_PARALLEL:-1}
    OLLAMA_MAX_LOADED_MODELS: ${LLM_MODELS_MAX:-1}
    OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTN:-1}
    # Browsers reach this server from the tunnel address, which Ollama refuses unless allowed here.
    OLLAMA_ORIGINS: ${LLM_CORS_ORIGINS:-*}
  volumes:
    - ollama_data:/root/.ollama
  # Only this machine reaches the raw API; everything else goes through the UI.
  ports:
    - "127.0.0.1:${BACKEND_PORT:-11434}:11434"
  healthcheck:
    test: ["CMD", "ollama", "list"]
    interval: 15s
    timeout: 10s
    start_period: 20s
    retries: 5
  networks:
    default:
      aliases: [backend]

services:
  # Pulls a small default model once the server is up, so the UI has something to chat with. Skipped
  # when the model is already there; clear LLM_DEFAULT_MODEL to turn it off (no colon in the default
  # below on purpose: an empty value is kept, not replaced by the default).
  model-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama}:${OLLAMA_TAG:-latest}
    restart: "no"
    environment:
      OLLAMA_HOST: http://backend:11434
      MODEL: ${LLM_DEFAULT_MODEL-qwen2.5:0.5b}
    entrypoint:
      - sh
      - -c
      - |
        [ -z "$$MODEL" ] && exit 0
        until ollama list >/dev/null 2>&1; do sleep 2; done
        if ollama show "$$MODEL" >/dev/null 2>&1; then
          echo "Model already downloaded: $$MODEL"
          exit 0
        fi
        echo "Downloading $$MODEL (this can take a while)..."
        attempt=1
        while [ "$$attempt" -le 5 ]; do
          if ollama pull "$$MODEL" 2>&1 | tr '\r' '\n'; then
            if ollama show "$$MODEL" >/dev/null 2>&1; then
              echo "Model ready: $$MODEL"
              exit 0
            fi
          fi
          echo "Download attempt $$attempt failed, retrying in 5s..."
          attempt=$$((attempt + 1))
          sleep 5
        done
        echo "Could not download $$MODEL. Check the model name (for example qwen2.5:0.5b)."
        exit 1

  backend-cpu:
    <<: *backend
    profiles: ["cpu"]

  backend-gpu:
    <<: *backend
    profiles: ["gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    image: ${BIGOPEN_FRONTEND_IMAGE:-ghcr.io/bigopenai/bo-inference-frontend}:${BIGOPEN_FRONTEND_VERSION:-latest}
    labels:
      # Not used by Docker: it only makes the hardware choice a field in the install
      # form. Docker itself reads COMPOSE_PROFILES from the .env file.
      bigopen.hardware: ${COMPOSE_PROFILES:-cpu}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:11434
    ports:
      - "${FRONTEND_PORT:-8081}:80"

volumes:
  ollama_data:
