# BigOpen Server: the BigOpen chat UI and llama.cpp's llama-server in one image,
# built by bigopenai/bigopen-inference and published to ECR as bigopen/bo-inference.
# Same compose file on Linux, macOS and Windows - nothing OS-specific to install.
#
#   model-init          downloads the model from Hugging Face into a volume (once)
#   bigopen-server      the server on CPU        (COMPOSE_PROFILES=cpu, the default)
#   bigopen-server-gpu  the server on an NVIDIA GPU (COMPOSE_PROFILES=gpu; needs the
#                       NVIDIA Container Toolkit, or Docker Desktop on Windows)
#
# Hardware and OS: every image tag is a multi-arch manifest, so Docker pulls the
# build that matches this host by itself: x86-64 or ARM64 (Apple Silicon, Graviton,
# Ampere), and for the GPU profile CUDA 12 on x86-64 or CUDA 13 on ARM64 (DGX Spark).
# Docker on macOS runs Linux in a VM that cannot use the Apple GPU, so a Mac runs the
# CPU profile. Only the CPU-or-NVIDIA choice is a setting (COMPOSE_PROFILES below).
#
# Every variable with a default value below shows up as a setting in the install
# form (so keep dollar-brace text out of comments: the form reads them too).
# To serve another model later, put its .gguf file in the bigopen_models volume
# (or change BIGOPEN_MODEL_REPO / BIGOPEN_MODEL_FILE and redeploy).
#
# The image is on GitHub Container Registry (also mirrored in ECR as bigopen/bo-inference): BIGOPEN_IMAGE is where it is pulled from, and
# BIGOPEN_VERSION is the release tag (tags are immutable, so each release is a new one).

x-server: &server
  restart: unless-stopped
  ports:
    - "8080:8080"
  environment:
    LLAMA_ARG_CTX_SIZE: ${BIGOPEN_CTX_SIZE:-8192}
    LLAMA_ARG_N_PARALLEL: ${BIGOPEN_PARALLEL:-1}
    LLAMA_ARG_TOOLS: all
    LLAMA_ARG_AGENT: "true"
    LLAMA_ARG_UI_MCP_PROXY: "true"
    LLAMA_ARG_CORS_ORIGINS: ${BIGOPEN_CORS_ORIGINS:-localhost}
  command: ["--models-dir", "/models"]
  volumes:
    - bigopen_models:/models:ro
  depends_on:
    model-init:
      condition: service_completed_successfully

services:
  model-init:
    image: curlimages/curl:latest
    user: "0"
    restart: "no"
    labels:
      # Not used by Docker: it just makes the hardware choice a field in the
      # install form. Docker itself reads COMPOSE_PROFILES from the .env file.
      bigopen.hardware: ${COMPOSE_PROFILES:-cpu}
    environment:
      MODEL_REPO: ${BIGOPEN_MODEL_REPO:-bartowski/Llama-3.2-3B-Instruct-GGUF}
      MODEL_FILE: ${BIGOPEN_MODEL_FILE:-Llama-3.2-3B-Instruct-Q4_K_M.gguf}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - bigopen_models:/models
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        dest="/models/$$MODEL_FILE"
        if [ -s "$$dest" ]; then
          echo "Model already downloaded: $$MODEL_FILE"
          exit 0
        fi
        url="https://huggingface.co/$$MODEL_REPO/resolve/main/$$MODEL_FILE"
        echo "Downloading $$MODEL_FILE from $$MODEL_REPO (this can take a while)..."
        attempt=1
        while [ "$$attempt" -le 5 ]; do
          if [ -n "$$HF_TOKEN" ]; then
            curl -fsSL -C - -H "Authorization: Bearer $$HF_TOKEN" -o "$$dest.part" "$$url" &
          else
            curl -fsSL -C - -o "$$dest.part" "$$url" &
          fi
          pid=$$!
          # One readable line every few seconds instead of curl's redrawing meter.
          while kill -0 "$$pid" 2>/dev/null; do
            sleep 5
            echo "  downloaded so far: $$(du -h "$$dest.part" 2>/dev/null | cut -f1)"
          done
          if wait "$$pid"; then
            mv "$$dest.part" "$$dest"
            echo "Model ready: $$MODEL_FILE"
            exit 0
          fi
          echo "Download attempt $$attempt failed, retrying in 5s..."
          attempt=$$((attempt + 1))
          sleep 5
        done
        echo "Could not download $$MODEL_FILE from $$MODEL_REPO. Check the repo and file name (and HF_TOKEN for gated models)."
        exit 1

  bigopen-server:
    <<: *server
    image: ${BIGOPEN_IMAGE:-ghcr.io/bigopenai/bo-inference}:${BIGOPEN_VERSION:-v1.0.2}
    profiles: ["cpu"]

  bigopen-server-gpu:
    <<: *server
    image: ${BIGOPEN_IMAGE:-ghcr.io/bigopenai/bo-inference}:${BIGOPEN_VERSION:-v1.0.2}-cuda
    profiles: ["gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  bigopen_models:
