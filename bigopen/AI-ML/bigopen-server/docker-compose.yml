# Llama.cpp Server: the official llama.cpp server plus the BigOpen chat UI.
#
#   backend   the official llama.cpp server image, in router mode. Models are
#             downloaded from Hugging Face on demand (from the UI) and kept in the
#             llamacpp_data volume, so a restart or an update keeps them.
#   frontend  nginx serving the BigOpen UI and passing API calls to the backend.
#
# Hardware is the COMPOSE_PROFILES setting: cpu (default) or gpu for an NVIDIA GPU
# (needs the NVIDIA Container Toolkit, or Docker Desktop on Windows). Every image is
# multi-arch (x86-64 and ARM64). Docker on macOS cannot reach the Apple GPU, so a Mac
# runs cpu. The first model is downloaded from the UI (Download a model).
# Built-in agent tools stay off: they can run commands on this machine.
#
# Every variable with a default below shows up as a setting in the install form,
# so keep placeholder text out of comments.

x-backend: &backend
  restart: unless-stopped
  environment:
    LLAMA_ARG_HOST: 0.0.0.0
    LLAMA_ARG_PORT: "8080"
    LLAMA_CACHE: /data
    LLAMA_ARG_CTX_SIZE: ${LLM_CTX_SIZE:-8192}
    LLAMA_ARG_N_PARALLEL: ${LLM_PARALLEL:-1}
    LLAMA_ARG_MODELS_MAX: ${LLM_MODELS_MAX:-1}
    LLAMA_ARG_FLASH_ATTN: ${LLM_FLASH_ATTN:-auto}
    LLAMA_API_KEY: ${LLM_API_KEY:-}
    LLAMA_ARG_CORS_ORIGINS: ${LLM_CORS_ORIGINS:-*}
    HF_TOKEN: ${HF_TOKEN:-}
    # Ignored by the CPU image; offloads everything to the GPU in the gpu profile.
    LLAMA_ARG_N_GPU_LAYERS: ${LLM_GPU_LAYERS:-all}
  volumes:
    - llamacpp_data:/data
  # No -m and no --models-dir: router mode. The server lists every model in its cache
  # (LLAMA_CACHE) and loads each one when it is asked for.
  healthcheck:
    test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
    interval: 15s
    timeout: 5s
    start_period: 20s
    retries: 5
  networks:
    default:
      aliases: [backend]

services:
  backend-cpu:
    <<: *backend
    image: ${LLAMACPP_IMAGE:-ghcr.io/ggml-org/llama.cpp}:${LLAMACPP_TAG:-server}
    profiles: ["cpu"]

  backend-gpu:
    <<: *backend
    image: ${LLAMACPP_IMAGE:-ghcr.io/ggml-org/llama.cpp}:${LLAMACPP_GPU_TAG:-server-cuda}
    profiles: ["gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    image: ${BIGOPEN_FRONTEND_IMAGE:-ghcr.io/bigopenai/bo-inference-frontend}:${BIGOPEN_FRONTEND_VERSION:-1.1.0}
    labels:
      # Not used by Docker: it only makes the hardware choice a field in the install
      # form. Docker itself reads COMPOSE_PROFILES from the .env file.
      bigopen.hardware: ${COMPOSE_PROFILES:-cpu}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  llamacpp_data:
