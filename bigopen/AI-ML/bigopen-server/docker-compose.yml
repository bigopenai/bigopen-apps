# Llama.cpp Server: the official llama.cpp server plus the BigOpen chat UI.
#
#   backend   the official llama.cpp server image, in router mode. Models are
#             downloaded from Hugging Face on demand (from the UI) and kept in the
#             .bigopen/models folder in the user home, so a restart or an update
#             keeps them.
#   frontend  nginx serving the BigOpen UI and passing API calls to the backend.
#
# Hardware is the COMPOSE_PROFILES setting: cpu (default), gpu (NVIDIA CUDA 12),
# cuda13 (NVIDIA CUDA 13, e.g. DGX Spark), amd (ROCm), vulkan or intel. NVIDIA needs the
# NVIDIA Container Toolkit (or Docker Desktop on Windows); amd, vulkan and intel need
# Linux with /dev/dri. Every image is multi-arch where upstream publishes it. Docker on macOS cannot reach the Apple GPU, so a Mac
# runs cpu. The first model is downloaded from the UI (Download a model).
# Built-in agent tools stay off: they can run commands on this machine.
#
# Every variable with a default below shows up as a setting in the install form,
# so keep placeholder text out of comments.

x-backend: &backend
  restart: unless-stopped
  environment:
    LLAMA_ARG_HOST: 0.0.0.0
    LLAMA_ARG_PORT: "8080"
    LLAMA_ARG_UI: "false"
    LLAMA_CACHE: /root/.cache/models
    LLAMA_ARG_CTX_SIZE: ${LLM_CTX_SIZE:-8192}
    LLAMA_ARG_N_PARALLEL: ${LLM_PARALLEL:-1}
    LLAMA_ARG_MODELS_MAX: ${LLM_MODELS_MAX:-1}
    LLAMA_ARG_FLASH_ATTN: ${LLM_FLASH_ATTN:-auto}
    LLAMA_API_KEY: ${LLM_API_KEY:-}
    LLAMA_ARG_CORS_ORIGINS: ${LLM_CORS_ORIGINS:-*}
    HF_TOKEN: ${HF_TOKEN:-}
    # Ignored by the CPU image; offloads everything to the GPU in the gpu profile.
    LLAMA_ARG_N_GPU_LAYERS: ${LLM_GPU_LAYERS:-all}
  volumes:
    # Models live in <bigopen-user home>/.bigopen/models. The agent provides
    # BIGOPEN_USER_HOME; where it is unset the home of the user running compose is used.
    # Set LLM_MODELS_DIR to choose any other folder.
    - ${LLM_MODELS_DIR:-${BIGOPEN_USER_HOME:-${HOME}}/.bigopen/models}:/root/.cache/models
  # No -m and no --models-dir: router mode. The server lists every model in its cache
  # (LLAMA_CACHE) and loads each one when it is asked for. --no-ui: API only.
  command: ["--no-ui"]
  depends_on:
    model-init:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
    interval: 15s
    timeout: 5s
    start_period: 20s
    retries: 5
  networks:
    default:
      aliases: [backend]

x-nvidia: &nvidia
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  # Puts the default model in the models folder before the backend starts. Skipped when
  # the file is already there; set LLM_DEFAULT_MODEL_FILE to an empty value to turn it off.
  model-init:
    image: curlimages/curl:8.11.1
    user: root
    restart: "no"
    environment:
      MODEL_REPO: ${LLM_DEFAULT_MODEL_REPO:-Qwen/Qwen2.5-0.5B-Instruct-GGUF}
      MODEL_FILE: ${LLM_DEFAULT_MODEL_FILE:-qwen2.5-0.5b-instruct-q4_k_m.gguf}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${LLM_MODELS_DIR:-${BIGOPEN_USER_HOME:-${HOME}}/.bigopen/models}:/models
    entrypoint:
      - sh
      - -c
      - |
        [ -z "$$MODEL_FILE" ] && exit 0
        repo=/models/models--$$(echo "$$MODEL_REPO" | sed 's|/|--|')
        # The server resolves snapshots through refs/main, so use the commit it points to.
        rev=$$(cat "$$repo/refs/main" 2>/dev/null)
        if [ -z "$$rev" ]; then
          rev=main
          mkdir -p "$$repo/refs"
          printf main > "$$repo/refs/main"
        fi
        dir="$$repo/snapshots/$$rev"
        dest="$$dir/$$MODEL_FILE"
        if [ -s "$$dest" ]; then
          echo "Model already downloaded: $$MODEL_FILE"
          exit 0
        fi
        mkdir -p "$$dir"
        url="https://huggingface.co/$$MODEL_REPO/resolve/main/$$MODEL_FILE"
        echo "Downloading $$MODEL_FILE from $$MODEL_REPO (this can take a while)..."
        attempt=1
        while [ "$$attempt" -le 5 ]; do
          if [ -n "$$HF_TOKEN" ]; then
            curl -fsSL -C - -H "Authorization: Bearer $$HF_TOKEN" -o "$$dest.part" "$$url" &
          else
            curl -fsSL -C - -o "$$dest.part" "$$url" &
          fi
          pid=$$!
          # One readable line every few seconds instead of curl's redrawing meter.
          while kill -0 "$$pid" 2>/dev/null; do
            sleep 5
            echo "  downloaded so far: $$(du -h "$$dest.part" 2>/dev/null | cut -f1)"
          done
          if wait "$$pid"; then
            mv "$$dest.part" "$$dest"
            echo "Model ready: $$MODEL_FILE"
            exit 0
          fi
          echo "Download attempt $$attempt failed, retrying in 5s..."
          attempt=$$((attempt + 1))
          sleep 5
        done
        echo "Could not download $$MODEL_FILE from $$MODEL_REPO. Check the repo and file name (and HF_TOKEN for gated models)."
        exit 1

  backend-cpu:
    <<: *backend
    image: ${LLAMACPP_IMAGE:-ghcr.io/ggml-org/llama.cpp}:${LLAMACPP_TAG:-server}
    profiles: ["cpu"]

  backend-gpu:
    <<: [*backend, *nvidia]
    image: ${LLAMACPP_IMAGE:-ghcr.io/ggml-org/llama.cpp}:${LLAMACPP_GPU_TAG:-server-cuda}
    profiles: ["gpu"]

  backend-cuda13:
    <<: [*backend, *nvidia]
    image: ${LLAMACPP_IMAGE:-ghcr.io/ggml-org/llama.cpp}:${LLAMACPP_CUDA13_TAG:-server-cuda13}
    profiles: ["cuda13"]

  backend-amd:
    <<: *backend
    image: ${LLAMACPP_IMAGE:-ghcr.io/ggml-org/llama.cpp}:${LLAMACPP_AMD_TAG:-server-rocm}
    profiles: ["amd"]
    devices:
      - /dev/kfd
      - /dev/dri
    group_add: [video]
    security_opt:
      - seccomp=unconfined

  backend-vulkan:
    <<: *backend
    image: ${LLAMACPP_IMAGE:-ghcr.io/ggml-org/llama.cpp}:${LLAMACPP_VULKAN_TAG:-server-vulkan}
    profiles: ["vulkan"]
    devices:
      - /dev/dri
    group_add: [video]

  backend-intel:
    <<: *backend
    image: ${LLAMACPP_IMAGE:-ghcr.io/ggml-org/llama.cpp}:${LLAMACPP_INTEL_TAG:-server-intel}
    profiles: ["intel"]
    devices:
      - /dev/dri
    group_add: [video]

  frontend:
    image: ${BIGOPEN_FRONTEND_IMAGE:-ghcr.io/bigopenai/bo-inference-frontend}:${BIGOPEN_FRONTEND_VERSION:-latest}
    labels:
      # Not used by Docker: it only makes the hardware choice a field in the install
      # form. Docker itself reads COMPOSE_PROFILES from the .env file.
      bigopen.hardware: ${COMPOSE_PROFILES:-cpu}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-8080}:80"
