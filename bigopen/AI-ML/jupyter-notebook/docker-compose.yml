services:
  jupyter-notebook:
    image: jupyter/scipy-notebook:latest
    restart: unless-stopped
    ports:
      - "8888:8888"
    # Start as root so the image's entrypoint can remap the notebook user to
    # bigopen-user's uid/gid and chown the mounted folder; it then drops
    # privileges, so Jupyter itself does not run as root.
    user: root
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-change-this-jupyter-token}
      # The BigOpen agent sets BIGOPEN_UID / BIGOPEN_GID from the bigopen-user
      # account on Linux and macOS. Without them (Windows, or running this file
      # by hand) the image's default notebook user is kept.
      NB_UID: ${BIGOPEN_UID:-1000}
      NB_GID: ${BIGOPEN_GID:-100}
      CHOWN_EXTRA: /home/jovyan/work
      CHOWN_EXTRA_OPTS: -R
    volumes:
      # Notebooks and projects live in <bigopen-user home>/jupiternotebook:
      #   Linux   /home/bigopen-user/jupiternotebook
      #   macOS   /Users/bigopen-user/jupiternotebook
      # The agent provides BIGOPEN_USER_HOME. Where there is no bigopen-user
      # (Windows) or the variable is unset, the folder is created next to this
      # compose file instead. Set JUPYTER_WORK_DIR to choose any other folder.
      # (No leading "./" here on purpose: a relative path is resolved by
      # docker compose against this file's folder on every OS.)
      - ${JUPYTER_WORK_DIR:-${BIGOPEN_USER_HOME:-.}/jupiternotebook}:/home/jovyan/work
    mem_limit: 2g
    cpus: 1.0
